<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>こむぎ音声会話</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:linear-gradient(180deg,#fff7fb 0%,#f4f8ff 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
  color:#233b55;
}
.card{
  width:min(380px,100%);
  background:#fff;
  border:1px solid #edf1f7;
  border-radius:28px;
  padding:28px 24px;
  box-shadow:0 18px 50px rgba(30,56,90,.14);
  text-align:center;
}
.paw{
  width:124px;height:124px;border-radius:50%;
  margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;
  font-size:60px;
  background:linear-gradient(180deg,#ffe6f0,#ffc9df);
  box-shadow:0 12px 30px rgba(255,139,185,.24);
}
.paw.listening{animation:pulse 1.2s infinite}
.paw.speaking{animation:speaking 1s infinite}
h1{font-size:22px;margin:0 0 8px}
.sub{font-size:13px;color:#78889a;line-height:1.65}
.status{
  margin:20px 0 14px;
  min-height:58px;
  padding:14px;
  border-radius:16px;
  background:#f7faff;
  font-size:14px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1.55;
}
.small{font-size:11px;color:#91a0b2;line-height:1.5;margin-bottom:16px}
button{
  width:100%;height:46px;border:0;border-radius:14px;
  background:#233f61;color:#fff;font-weight:900;cursor:pointer
}
@keyframes pulse{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,130,180,.38)}
  70%{transform:scale(1.05);box-shadow:0 0 0 18px rgba(255,130,180,0)}
  100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,130,180,0)}
}
@keyframes speaking{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.045)}
}
</style>
</head>
<body>
<main class="card">
  <div id="paw" class="paw">🐾</div>
  <h1>こむぎ音声会話</h1>
  <div class="sub">肉球を押した後は、そのまま会話を続けられるよ。</div>
  <div id="status" class="status">音声会話を準備してるワン…🐾</div>
  <div class="small">完全無料：ブラウザの音声認識と読み上げだけを使用</div>
  <button type="button" onclick="stopConversation(true)">音声会話を終了</button>
</main>

<script>
let recognition = null;
let listening = false;
let stopped = false;
let speechEnabled = true;
let selectedVoice = null;
let restartTimer = null;

function setStatus(text,state){
  const status = document.getElementById('status');
  const paw = document.getElementById('paw');

  status.textContent = text;
  paw.classList.remove('listening','speaking');

  if(state) paw.classList.add(state);

  try{
    if(window.opener && !window.opener.closed){
      window.opener.postMessage({
        type:'KOMUGI_STATUS',
        text:text
      },'*');
    }
  }catch(e){}
}

function chooseVoice(){
  if(!('speechSynthesis' in window)) return;

  const voices = window.speechSynthesis.getVoices() || [];
  const ja = voices.filter(v =>
    /^ja(-|_)?/i.test(v.lang || '') ||
    /日本|Japanese/i.test(v.name || '')
  );

  const maleHints = /male|man|boy|男性|男声|otoya|ichiro|takumi|keita/i;

  selectedVoice =
    ja.find(v => maleHints.test(v.name || '')) ||
    ja.find(v => /google.*日本語|google.*japanese/i.test(v.name || '')) ||
    ja[0] ||
    null;
}

function init(){
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  chooseVoice();

  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = chooseVoice;
  }

  if(!SpeechRecognition){
    setStatus(
      'このブラウザは音声認識に対応してないよ。Chrome / Edgeで開いてね。',
      ''
    );
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function(){
    listening = true;
    setStatus('聞いてるワン…🐾 普通に話してね。','listening');
  };

  recognition.onresult = function(event){
    let finalText = '';

    for(let i=event.resultIndex;i<event.results.length;i++){
      if(event.results[i].isFinal){
        finalText += event.results[i][0].transcript || '';
      }
    }

    finalText = finalText.trim();

    if(finalText){
      stopRecognitionSilently();

      try{
        if(window.opener && !window.opener.closed){
          window.opener.postMessage({
            type:'KOMUGI_TRANSCRIPT',
            text:finalText
          },'*');
        }
      }catch(e){}

      setStatus('こむぎが考えてるワン…🐾','');
    }
  };

  recognition.onerror = function(event){
    listening = false;

    const error = event && event.error ? event.error : '';

    if(stopped) return;

    if(error === 'not-allowed' || error === 'service-not-allowed'){
      setStatus(
        'マイクの許可が必要だよ。ブラウザのマイク許可をONにしてね。',
        ''
      );
      return;
    }

    if(error === 'no-speech'){
      restartListening(350);
      return;
    }

    if(error === 'aborted'){
      return;
    }

    setStatus('音声認識でエラーが出たよ。もう一回試すワン…🐾','');
    restartListening(700);
  };

  recognition.onend = function(){
    listening = false;

    if(stopped) return;

    // こむぎの返答待ち中でなければ再開。
    const statusText = document.getElementById('status').textContent || '';

    if(
      statusText.indexOf('考えてる') < 0 &&
      statusText.indexOf('話してる') < 0
    ){
      restartListening(300);
    }
  };

  try{
    if(window.opener && !window.opener.closed){
      window.opener.postMessage({type:'KOMUGI_READY'},'*');
    }
  }catch(e){}

  // 1回押した流れのまま自動開始
  window.setTimeout(startListening,250);
}

function startListening(){
  if(stopped || !recognition || listening) return;

  if('speechSynthesis' in window && window.speechSynthesis.speaking){
    return;
  }

  try{
    recognition.start();
  }catch(e){
    restartListening(600);
  }
}

function restartListening(delay){
  clearTimeout(restartTimer);
  if(stopped) return;

  restartTimer = setTimeout(function(){
    startListening();
  },Number(delay || 0));
}

function stopRecognitionSilently(){
  if(!recognition) return;

  try{
    if(listening) recognition.abort();
  }catch(e){}

  listening = false;
}

function speakReply(text){
  if(!speechEnabled || !('speechSynthesis' in window)){
    setStatus('聞いてるワン…🐾 次もそのまま話してね。','listening');
    restartListening(250);
    return;
  }

  stopRecognitionSilently();
  window.speechSynthesis.cancel();

  let spoken = String(text || '')
    .replace(/🐾/g,'')
    .replace(/[\r\n]+/g,'。')
    .replace(/\s+/g,' ')
    .trim();

  if(!spoken){
    restartListening(250);
    return;
  }

  const utter = new SpeechSynthesisUtterance(spoken);
  utter.lang = 'ja-JP';

  if(selectedVoice){
    utter.voice = selectedVoice;
  }

  // 少し高め・少しゆっくりで可愛い男の子っぽく
  utter.pitch = 1.30;
  utter.rate = 0.96;
  utter.volume = 1.0;

  utter.onstart = function(){
    setStatus('こむぎが話してるワン…🐾','speaking');
  };

  utter.onend = function(){
    if(stopped) return;
    setStatus('聞いてるワン…🐾 次もそのまま話してね。','listening');
    restartListening(320);
  };

  utter.onerror = function(){
    if(stopped) return;
    restartListening(350);
  };

  window.speechSynthesis.speak(utter);
}

function stopConversation(closeWindow){
  stopped = true;
  clearTimeout(restartTimer);

  try{ stopRecognitionSilently(); }catch(e){}
  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
    }
  }catch(e){}

  try{
    if(window.opener && !window.opener.closed){
      window.opener.postMessage({type:'KOMUGI_CLOSED'},'*');
    }
  }catch(e){}

  if(closeWindow){
    window.close();
  }
}

window.addEventListener('message',function(event){
  if(!event.data || typeof event.data !== 'object') return;

  if(event.data.type === 'KOMUGI_REPLY'){
    speakReply(event.data.text || '');
    return;
  }

  if(event.data.type === 'KOMUGI_SET_SPEECH'){
    speechEnabled = event.data.enabled !== false;
    return;
  }

  if(event.data.type === 'KOMUGI_STOP'){
    stopConversation(true);
  }
});

window.addEventListener('beforeunload',function(){
  stopped = true;
  try{
    if(window.opener && !window.opener.closed){
      window.opener.postMessage({type:'KOMUGI_CLOSED'},'*');
    }
  }catch(e){}
});

init();
</script>
</body>
</html>
